name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore KineticLLM.sln
      - name: Build
        run: dotnet build KineticLLM.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test KineticLLM.sln --configuration Release --no-build --verbosity normal
